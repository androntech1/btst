name: Fetch and Filter ScanX Data

on:
  schedule:
    # 3:10 PM IST is 09:40 UTC, Monday to Friday (1-5)
    - cron: '40 9 * * 1-5'
  
  # Allows manual testing from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caching pip dependencies for faster runs

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Screener Script
        run: python run_screener.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_*.json
          git diff --staged --quiet || git commit -m "Auto-save filtered ScanX data for $(date +'%Y-%m-%d')"
          git push
