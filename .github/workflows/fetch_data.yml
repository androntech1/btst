name: Fetch and Filter ScanX Data

on:
  schedule:
    # 3:10 PM IST, Monday to Friday
    - cron: '10 15 * * 1-5'
      timezone: 'Asia/Kolkata'

  # Allows manual testing from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run stock screener
      # --------------------------------------------------
      - name: Run Screener Script
        run: |
          python run_screener.py

      # --------------------------------------------------
      # Commit generated JSON + README
      # --------------------------------------------------
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data_*.json manifest.json README.md index.html .gitignore

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update daily stock scanner results $(date +'%Y-%m-%d')"

          git push
